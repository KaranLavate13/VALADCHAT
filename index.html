<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALADCHAT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --imessage-blue: #007AFF;
      --imessage-blue-hover: #1486FF;
      --imessage-incoming: rgba(255, 255, 255, 0.08);
      --glass-surface: rgba(18, 22, 30, 0.08);
      --glass-elevated: rgba(28, 34, 46, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-blur: blur(5%);
    }

    body {
      background:
        radial-gradient(circle at 15% 15%, rgba(0, 122, 255, 0.22), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(52, 199, 89, 0.12), transparent 45%),
        linear-gradient(160deg, #07090e 0%, #0d111a 55%, #080b12 100%);
      color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    .imessage-glass {
      background: var(--glass-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .imessage-panel {
      background: var(--glass-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .imessage-bubble-sent {
      background: linear-gradient(180deg, var(--imessage-blue-hover) 0%, var(--imessage-blue) 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.28);
    }

    .imessage-bubble-recv {
      background: var(--imessage-incoming);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f2f4f8;
    }

    .imessage-send-btn {
      background: var(--imessage-blue);
    }
    .imessage-send-btn:hover {
      background: var(--imessage-blue-hover);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 9999px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center relative">

  <!-- FLOATING IN-APP NOTIFICATION BUBBLE -->
  <div id="in-app-bubble" class="hidden fixed top-4 right-4 z-[60] max-w-sm w-[calc(100vw-2rem)] sm:w-80 imessage-panel rounded-2xl p-3.5 cursor-pointer transition-all duration-200 hover:scale-[1.01]">
    <div class="flex items-start gap-3">
      <div class="w-9 h-9 rounded-full imessage-send-btn flex items-center justify-center text-white font-semibold text-xs flex-shrink-0">
        iM
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <span id="bubble-sender" class="text-xs font-semibold text-white truncate">New Message</span>
          <span class="text-[10px] text-sky-300 font-medium">now</span>
        </div>
        <p id="bubble-chat" class="text-[11px] text-gray-400 truncate"></p>
        <p id="bubble-preview" class="text-xs text-gray-100 mt-1 line-clamp-2"></p>
      </div>
      <button id="btn-close-bubble" type="button" class="text-gray-400 hover:text-white text-xs px-1">×</button>
    </div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="imessage-panel p-10 rounded-[28px] max-w-md w-full mx-4 text-center">
    <div class="w-16 h-16 mx-auto mb-5 rounded-[20px] imessage-bubble-sent flex items-center justify-center">
      <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 3C6.48 3 2 6.58 2 11c0 2.03.87 3.87 2.3 5.27-.16 1.54-.84 2.94-1.88 3.94a.5.5 0 0 0 .35.86c2.18-.04 4.17-.77 5.66-1.82.82.24 1.68.37 2.57.37 5.52 0 10-3.58 10-8s-4.48-8-10-8Z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-semibold tracking-tight text-white mb-1.5">VALADCHAT</h1>
    <p class="text-xs text-gray-400 mb-7">iMessage • Liquid Glass • Gmail Sign-In</p>
    <button id="btn-login" type="button" class="w-full py-3.5 px-5 rounded-2xl imessage-glass hover:bg-white/10 text-white font-semibold text-sm flex items-center justify-center gap-3 transition cursor-pointer">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 bg-white rounded-full p-0.5" alt="Google" />
      <span>Choose Gmail Account</span>
    </button>
    <p id="login-status" class="text-xs text-sky-400 mt-4 hidden"></p>
    <p id="login-error" class="text-xs text-rose-400 mt-4 hidden break-words"></p>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen" class="hidden w-full h-full max-w-7xl mx-auto p-2 sm:p-4 flex gap-3">

    <!-- SIDEBAR (MESSAGES LIST) -->
    <aside id="sidebar" class="imessage-panel rounded-[26px] w-full md:w-80 flex-shrink-0 flex flex-col overflow-hidden">
      <div class="px-4 py-3.5 border-b border-white/10 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <img id="user-avatar" src="" class="w-9 h-9 rounded-full border border-white/20 object-cover flex-shrink-0" alt="" />
          <div class="min-w-0">
            <p id="user-name" class="text-sm font-semibold text-white truncate"></p>
            <p id="user-email" class="text-[11px] text-gray-400 truncate"></p>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <button id="btn-sound-toggle" type="button" title="Toggle Notification Sound" class="p-2 rounded-xl imessage-glass hover:bg-white/10 text-sky-300 transition text-xs">
            <span id="sound-icon">🔔</span>
          </button>
          <button id="btn-logout" type="button" title="Switch Account / Logout" class="p-2 rounded-xl imessage-glass hover:bg-white/10 text-gray-300 hover:text-white transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="p-2.5 grid grid-cols-2 gap-2 border-b border-white/10">
        <button id="btn-new-dm" type="button" class="imessage-glass hover:bg-white/10 text-xs font-medium py-2 px-3 rounded-xl text-sky-300 transition">+ Direct Chat</button>
        <button id="btn-new-group" type="button" class="imessage-glass hover:bg-white/10 text-xs font-medium py-2 px-3 rounded-xl text-gray-200 transition">+ New Group</button>
      </div>

      <div id="chat-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <p class="text-xs text-gray-400 text-center mt-10">No conversations yet.</p>
      </div>
    </aside>

    <!-- CHAT PANE -->
    <main id="chat-pane" class="imessage-panel rounded-[26px] flex-1 hidden md:flex flex-col overflow-hidden relative">
      <div id="empty-chat" class="flex-1 flex flex-col items-center justify-center text-center p-6">
        <div class="w-12 h-12 rounded-2xl imessage-glass flex items-center justify-center mb-3 text-sky-400 text-lg font-semibold">iM</div>
        <h2 class="text-base font-semibold text-white">Messages</h2>
        <p class="text-xs text-gray-400 mt-1 max-w-xs">Select a thread or start a chat. Paste screenshots with Ctrl+V or attach images.</p>
      </div>

      <div id="active-chat" class="hidden flex-1 flex flex-col h-full">
        <div class="px-4 py-3 border-b border-white/10 flex items-center justify-between gap-3 imessage-glass">
          <div class="flex items-center gap-2.5 min-w-0">
            <button id="btn-back" type="button" class="md:hidden px-2.5 py-1.5 rounded-xl imessage-glass text-sky-400 text-xs font-medium">‹ Back</button>
            <div class="min-w-0">
              <h3 id="chat-title" class="text-sm font-semibold text-white truncate"></h3>
              <p id="chat-subtitle" class="text-[11px] text-gray-400 truncate"></p>
            </div>
          </div>
          <span class="text-[11px] text-gray-400 hidden sm:inline">iMessage</span>
        </div>

        <div id="messages-box" class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5"></div>

        <!-- SCREENSHOT PREVIEW -->
        <div id="image-preview-bar" class="hidden px-4 py-2 imessage-glass border-t border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="preview-thumb" src="" class="h-12 w-auto rounded-xl border border-white/20 object-cover" />
            <span class="text-xs text-sky-300 font-medium">Screenshot attached</span>
          </div>
          <button id="btn-clear-image" type="button" class="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded-lg imessage-glass">Remove</button>
        </div>

        <!-- IMESSAGE COMPOSER BAR -->
        <form id="message-form" class="p-3 border-t border-white/10 flex items-center gap-2">
          <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp" class="hidden" />
          <button id="btn-attach" type="button" title="Attach Screenshot / Image Only" class="w-9 h-9 rounded-full imessage-glass hover:bg-white/10 text-gray-300 hover:text-white flex items-center justify-center flex-shrink-0 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </button>
          <input
            id="message-input"
            type="text"
            autocomplete="off"
            placeholder="iMessage or paste screenshot (Ctrl+V)..."
            class="flex-1 imessage-glass rounded-full px-4 py-2 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-sky-400/60"
          />
          <button type="submit" aria-label="Send" class="w-9 h-9 rounded-full imessage-send-btn text-white font-bold text-sm flex items-center justify-center flex-shrink-0 transition shadow-md">
            ↑
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- MODAL: NEW DM -->
  <div id="modal-dm" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" style="backdrop-filter: blur(5%);">
    <div class="imessage-panel rounded-[24px] p-6 max-w-sm w-full space-y-4">
      <h3 class="text-base font-semibold text-white">New iMessage</h3>
      <input id="dm-email-input" type="email" placeholder="recipient@gmail.com" class="w-full imessage-glass rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none" />
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" id="btn-cancel-dm" class="px-4 py-2 rounded-xl text-xs text-gray-300 imessage-glass">Cancel</button>
        <button type="button" id="btn-create-dm" class="px-4 py-2 rounded-xl text-xs font-semibold imessage-send-btn text-white">Start Chat</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NEW GROUP -->
  <div id="modal-group" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" style="backdrop-filter: blur(5%);">
    <div class="imessage-panel rounded-[24px] p-6 max-w-md w-full space-y-4">
      <h3 class="text-base font-semibold text-white">New Group</h3>
      <input id="group-name-input" type="text" placeholder="Group Name" class="w-full imessage-glass rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none" />
      <textarea id="group-members-input" rows="3" placeholder="user1@gmail.com, user2@gmail.com" class="w-full imessage-glass rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none"></textarea>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" id="btn-cancel-group" class="px-4 py-2 rounded-xl text-xs text-gray-300 imessage-glass">Cancel</button>
        <button type="button" id="btn-create-group" class="px-4 py-2 rounded-xl text-xs font-semibold imessage-send-btn text-white">Create Group</button>
      </div>
    </div>
  </div>

  <!-- IMAGE LIGHTBOX -->
  <div id="lightbox" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 cursor-zoom-out" style="backdrop-filter: blur(5%);">
    <img id="lightbox-img" src="" class="max-h-[90vh] max-w-[95vw] rounded-2xl shadow-2xl border border-white/15" />
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, off, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const errEl = document.getElementById("login-error");
    const statusEl = document.getElementById("login-status");

    function showError(msg) {
      statusEl.classList.add("hidden");
      errEl.textContent = msg;
      errEl.classList.remove("hidden");
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAZ-gfYvJk9VO8ahIDUMJffEkSI3tvTxmg",
      authDomain: "my-private-project-1307.firebaseapp.com",
      databaseURL: "https://my-private-project-1307-default-rtdb.firebaseio.com",
      projectId: "my-private-project-1307",
      storageBucket: "my-private-project-1307.firebasestorage.app",
      messagingSenderId: "36501656008",
      appId: "1:36501656008:web:4a16827bbd14d112a7b0fd",
      measurementId: "G-KMFDD7JSY0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    let currentUser = null;
    let activeChatId = null;
    let activeMessagesRef = null;
    let pendingImageBase64 = null;
    let soundEnabled = true;
    let bubbleTimer = null;
    let latestChatsSnapshotData = {};
    const chatMetaById = new Map();
    const watchedChatListeners = new Set();

    const sanitizeEmail = (email) => email.trim().toLowerCase().replace(/\./g, ",");

    // Notification Sound (Web Audio API chime)
    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = "sine";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(880, now);
        osc2.frequency.setValueAtTime(1174.66, now + 0.09);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.14, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now + 0.09);
        osc1.stop(now + 0.14);
        osc2.stop(now + 0.38);
      } catch (e) {}
    }

    async function requestDesktopNotificationPermission() {
      if ("Notification" in window && Notification.permission === "default") {
        try {
          await Notification.requestPermission();
        } catch (e) {}
      }
    }

    function triggerMessageNotification(chatId, chatTitle, senderName, msg) {
      playNotificationSound();

      const previewText = msg.image && !msg.text
        ? "Sent a screenshot"
        : (msg.image && msg.text ? "[Screenshot] " + msg.text : msg.text);

      if (String(activeChatId) !== String(chatId) || document.hidden) {
        const bubble = document.getElementById("in-app-bubble");
        document.getElementById("bubble-sender").textContent = senderName;
        document.getElementById("bubble-chat").textContent = chatTitle;
        document.getElementById("bubble-preview").textContent = previewText;
        bubble.dataset.chatId = chatId;
        bubble.classList.remove("hidden");

        if (bubbleTimer) clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => {
          bubble.classList.add("hidden");
        }, 4500);
      }

      if ("Notification" in window && Notification.permission === "granted" && (document.hidden || !document.hasFocus())) {
        try {
          const popup = new Notification(`${senderName} • ${chatTitle}`, {
            body: previewText,
            tag: "valadchat-" + chatId,
            renotify: true
          });
          popup.onclick = () => {
            window.focus();
            const meta = chatMetaById.get(chatId);
            if (meta) openChat(chatId, meta.title, meta.subtitle);
            popup.close();
          };
        } catch (e) {}
      }
    }

    document.getElementById("in-app-bubble").onclick = (e) => {
      if (e.target.id === "btn-close-bubble") {
        document.getElementById("in-app-bubble").classList.add("hidden");
        return;
      }
      const chatId = document.getElementById("in-app-bubble").dataset.chatId;
      document.getElementById("in-app-bubble").classList.add("hidden");
      const meta = chatMetaById.get(chatId);
      if (chatId && meta) openChat(chatId, meta.title, meta.subtitle);
    };

    document.getElementById("btn-sound-toggle").onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById("sound-icon").innerHTML = soundEnabled ? "🔔" : "🔇";
    };

    getRedirectResult(auth).catch((err) => {
      if (err && err.code) showError("Redirect error: " + err.code + " - " + err.message);
    });

    document.getElementById("btn-login").onclick = async () => {
      errEl.classList.add("hidden");
      statusEl.textContent = "Opening Google account selector...";
      statusEl.classList.remove("hidden");
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === "auth/popup-blocked" || err.code === "auth/cancelled-popup-request") {
          statusEl.textContent = "Redirecting to Google sign-in...";
          await signInWithRedirect(auth, provider);
        } else {
          showError("Sign-in failed (" + (err.code || "error") + "): " + err.message);
        }
      }
    };

    document.getElementById("btn-logout").onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        statusEl.classList.add("hidden");
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("app-screen").classList.remove("hidden");
        document.getElementById("user-name").textContent = user.displayName || user.email;
        document.getElementById("user-email").textContent = user.email;
        document.getElementById("user-avatar").src = user.photoURL || ("https://ui-avatars.com/api/?name=" + encodeURIComponent(user.email));

        requestDesktopNotificationPermission();

        try {
          await set(ref(db, "users/" + sanitizeEmail(user.email)), {
            email: user.email.toLowerCase(),
            name: user.displayName || user.email.split("@")[0],
            photo: user.photoURL || ""
          });
        } catch (e) {
          console.error(e);
        }

        listenToUserChats();
      } else {
        currentUser = null;
        activeChatId = null;
        latestChatsSnapshotData = {};
        document.getElementById("app-screen").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
      }
    });

    function closeModals() {
      document.getElementById("modal-dm").classList.add("hidden");
      document.getElementById("modal-group").classList.add("hidden");
    }
    document.getElementById("btn-new-dm").onclick = () => document.getElementById("modal-dm").classList.remove("hidden");
    document.getElementById("btn-new-group").onclick = () => document.getElementById("modal-group").classList.remove("hidden");
    document.getElementById("btn-cancel-dm").onclick = closeModals;
    document.getElementById("btn-cancel-group").onclick = closeModals;
    document.getElementById("lightbox").onclick = () => document.getElementById("lightbox").classList.add("hidden");

    document.getElementById("btn-create-dm").onclick = async () => {
      const rawEmail = document.getElementById("dm-email-input").value.trim().toLowerCase();
      if (!rawEmail || !rawEmail.includes("@") || rawEmail === currentUser.email.toLowerCase()) {
        return alert("Please enter a valid Gmail address other than your own.");
      }
      const myKey = sanitizeEmail(currentUser.email);
      const otherKey = sanitizeEmail(rawEmail);
      const chatId = "dm_" + [myKey, otherKey].sort().join("__");

      const chatRef = ref(db, "chats/" + chatId);
      const snap = await get(chatRef);
      if (!snap.exists()) {
        await set(chatRef, {
          type: "dm",
          members: {
            [myKey]: currentUser.email.toLowerCase(),
            [otherKey]: rawEmail
          },
          createdAt: Date.now()
        });
      }
      document.getElementById("dm-email-input").value = "";
      closeModals();
      openChat(chatId, rawEmail, "iMessage");
    };

    document.getElementById("btn-create-group").onclick = async () => {
      const name = document.getElementById("group-name-input").value.trim();
      const rawList = document.getElementById("group-members-input").value.split(",").map(e => e.trim().toLowerCase()).filter(e => e.includes("@"));
      if (!name) return alert("Enter a group name.");
      if (rawList.length === 0) return alert("Enter at least one member Gmail address.");

      const membersObj = { [sanitizeEmail(currentUser.email)]: currentUser.email.toLowerCase() };
      rawList.forEach(email => { membersObj[sanitizeEmail(email)] = email; });

      const newGroupRef = push(ref(db, "chats"));
      await set(newGroupRef, {
        type: "group",
        name: name,
        members: membersObj,
        createdAt: Date.now()
      });

      document.getElementById("group-name-input").value = "";
      document.getElementById("group-members-input").value = "";
      closeModals();
      openChat(newGroupRef.key, name, Object.values(membersObj).join(", "));
    };

    function watchChatForNotifications(chatId, chatTitle) {
      if (watchedChatListeners.has(chatId)) return;
      watchedChatListeners.add(chatId);

      let initialLoadDone = false;
      const knownKeys = new Set();

      onValue(ref(db, "messages/" + chatId), (snapshot) => {
        const msgs = snapshot.val() || {};
        const entries = Object.entries(msgs);

        if (!initialLoadDone) {
          entries.forEach(([key]) => knownKeys.add(key));
          initialLoadDone = true;
          return;
        }

        entries.forEach(([key, m]) => {
          if (!knownKeys.has(key)) {
            knownKeys.add(key);
            if (currentUser && m.senderEmail !== currentUser.email.toLowerCase()) {
              const meta = chatMetaById.get(chatId);
              triggerMessageNotification(
                chatId,
                (meta && meta.title) || chatTitle,
                m.senderName || m.senderEmail,
                m
              );
            }
          }
        });
      });
    }

    // Re-renders sidebar list so active highlight always matches activeChatId
    function renderChatList() {
      if (!currentUser) return;
      const myKey = sanitizeEmail(currentUser.email);
      const listEl = document.getElementById("chat-list");
      listEl.innerHTML = "";

      const myChats = Object.entries(latestChatsSnapshotData || {}).filter(
        (entry) => entry[1] && entry[1].members && entry[1].members[myKey]
      );

      if (myChats.length === 0) {
        const empty = document.createElement("p");
        empty.className = "text-xs text-gray-400 text-center mt-10";
        empty.textContent = "No conversations yet.";
        listEl.appendChild(empty);
        return;
      }

      myChats.forEach(([id, chat]) => {
        const chatKey = String(id);
        const isSelected = activeChatId !== null && String(activeChatId) === chatKey;
        const memberEmails = Object.values(chat.members);
        const title = chat.type === "group"
          ? chat.name
          : (memberEmails.find(e => e !== currentUser.email.toLowerCase()) || currentUser.email);
        const subtitle = chat.type === "group" ? (memberEmails.length + " members") : "iMessage";
        const fullSubtitle = chat.type === "group" ? memberEmails.join(", ") : "iMessage";

        chatMetaById.set(chatKey, { title, subtitle: fullSubtitle });
        watchChatForNotifications(chatKey, title);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.chatId = chatKey;
        btn.className = "w-full text-left p-3 rounded-2xl transition flex items-center gap-3 " + (
          isSelected
            ? "imessage-bubble-sent text-white"
            : "hover:bg-white/10"
        );

        const avatar = document.createElement("div");
        avatar.className = "w-10 h-10 rounded-full flex items-center justify-center font-semibold text-sm flex-shrink-0 " + (
          isSelected
            ? "bg-white/20 text-white"
            : "imessage-glass text-sky-300"
        );
        avatar.textContent = title.charAt(0).toUpperCase();

        const info = document.createElement("div");
        info.className = "min-w-0 flex-1";
        const pTitle = document.createElement("p");
        pTitle.className = "text-sm font-semibold truncate " + (isSelected ? "text-white" : "text-gray-100");
        pTitle.textContent = title;
        const pSub = document.createElement("p");
        pSub.className = "text-xs truncate " + (isSelected ? "text-white/80" : "text-gray-400");
        pSub.textContent = subtitle;

        info.appendChild(pTitle);
        info.appendChild(pSub);
        btn.appendChild(avatar);
        btn.appendChild(info);
        btn.onclick = () => openChat(chatKey, title, fullSubtitle);
        listEl.appendChild(btn);
      });
    }

    function listenToUserChats() {
      onValue(ref(db, "chats"), (snapshot) => {
        latestChatsSnapshotData = snapshot.val() || {};
        renderChatList();
      });
    }

    function openChat(chatId, title, subtitle) {
      activeChatId = String(chatId);
      renderChatList();

      document.getElementById("in-app-bubble").classList.add("hidden");
      document.getElementById("sidebar").classList.add("hidden", "md:flex");
      document.getElementById("chat-pane").classList.remove("hidden");
      document.getElementById("chat-pane").classList.add("flex");
      document.getElementById("empty-chat").classList.add("hidden");
      document.getElementById("active-chat").classList.remove("hidden");

      document.getElementById("chat-title").textContent = title;
      document.getElementById("chat-subtitle").textContent = subtitle;

      if (activeMessagesRef) off(activeMessagesRef);
      activeMessagesRef = ref(db, "messages/" + activeChatId);

      onValue(activeMessagesRef, (snapshot) => {
        const box = document.getElementById("messages-box");
        box.innerHTML = "";
        const msgs = snapshot.val() || {};
        Object.values(msgs).forEach((m) => {
          const isMe = m.senderEmail === currentUser.email.toLowerCase();
          const wrap = document.createElement("div");
          wrap.className = "flex flex-col " + (isMe ? "items-end" : "items-start");

          const meta = document.createElement("span");
          meta.className = "text-[10px] text-gray-400 mb-1 px-1.5";
          const timeStr = new Date(m.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          meta.textContent = (isMe ? "You" : (m.senderName || m.senderEmail)) + " • " + timeStr;

          const bubble = document.createElement("div");
          bubble.className = "max-w-[80%] sm:max-w-md rounded-[20px] px-3.5 py-2 text-sm " + (isMe ? "imessage-bubble-sent rounded-br-md" : "imessage-bubble-recv rounded-bl-md");

          if (m.image) {
            const imgEl = document.createElement("img");
            imgEl.src = m.image;
            imgEl.className = "rounded-xl max-h-72 w-auto mb-1.5 cursor-zoom-in border border-white/15";
            imgEl.onclick = () => {
              document.getElementById("lightbox-img").src = m.image;
              document.getElementById("lightbox").classList.remove("hidden");
            };
            bubble.appendChild(imgEl);
          }
          if (m.text) {
            const txtEl = document.createElement("p");
            txtEl.className = "whitespace-pre-wrap break-words leading-snug";
            txtEl.textContent = m.text;
            bubble.appendChild(txtEl);
          }

          wrap.appendChild(meta);
          wrap.appendChild(bubble);
          box.appendChild(wrap);
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    document.getElementById("btn-back").onclick = () => {
      activeChatId = null;
      renderChatList();
      document.getElementById("chat-pane").classList.add("hidden");
      document.getElementById("sidebar").classList.remove("hidden");
    };

    const ALLOWED_TYPES = ["image/png", "image/jpeg", "image/webp"];

    function processImageFile(file) {
      if (!file || !ALLOWED_TYPES.includes(file.type)) {
        alert("Only PNG, JPEG, or WEBP images/screenshots are allowed.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX_W = 850;
          const scale = img.width > MAX_W ? MAX_W / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          pendingImageBase64 = canvas.toDataURL("image/jpeg", 0.72);
          document.getElementById("preview-thumb").src = pendingImageBase64;
          document.getElementById("image-preview-bar").classList.remove("hidden");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.addEventListener("paste", (e) => {
      if (!activeChatId) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const item of items) {
        if (item.kind === "file") {
          e.preventDefault();
          processImageFile(item.getAsFile());
          return;
        }
      }
    });

    document.getElementById("btn-attach").onclick = () => document.getElementById("image-input").click();
    document.getElementById("image-input").onchange = (e) => {
      if (e.target.files[0]) processImageFile(e.target.files[0]);
      e.target.value = "";
    };

    document.addEventListener("dragover", (e) => e.preventDefault());
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      if (!activeChatId) return;
      if (e.dataTransfer.files[0]) processImageFile(e.dataTransfer.files[0]);
    });

    function clearPendingImage() {
      pendingImageBase64 = null;
      document.getElementById("image-preview-bar").classList.add("hidden");
      document.getElementById("preview-thumb").src = "";
    }
    document.getElementById("btn-clear-image").onclick = clearPendingImage;

    document.getElementById("message-form").onsubmit = async (e) => {
      e.preventDefault();
      if (!activeChatId || !currentUser) return;
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text && !pendingImageBase64) return;

      const msgData = {
        senderEmail: currentUser.email.toLowerCase(),
        senderName: currentUser.displayName || currentUser.email.split("@")[0],
        text: text,
        image: pendingImageBase64 || null,
        timestamp: Date.now()
      };

      input.value = "";
      clearPendingImage();
      await push(ref(db, "messages/" + activeChatId), msgData);
    };
  </script>
</body>
</html>
